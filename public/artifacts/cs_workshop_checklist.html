<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>From Panic to a Plan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #ffffff;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            text-align: center;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #2563eb;
            letter-spacing: -0.5px;
        }

        h2 {
            font-size: 24px;
            font-weight: 400;
            color: #666;
            margin-bottom: 48px;
        }

        .checklist {
            list-style: none;
            text-align: left;
            max-width: 650px;
            margin: 0 auto;
        }

        .checklist li {
            font-size: 20px;
            line-height: 1.8;
            margin-bottom: 24px;
            padding-left: 36px;
            position: relative;
            color: #1a1a1a;
        }

        .checklist li:before {
            content: "☐";
            position: absolute;
            left: 0;
            font-size: 24px;
            color: #2563eb;
            line-height: 1.4;
        }

        .checklist li:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>From Panic to a Plan</h1>
        <h2>End-of-Workshop Checklist</h2>
        <ul class="checklist">
            <li>Apply to 3 roles this week (even if they feel like a stretch).</li>
            <li>Book 1 office hour with a professor, TA, or mentor.</li>
            <li>Find 1 resume buddy in this club and swap drafts.</li>
            <li>Pick 1 coding resource and commit to 2 practice sessions this week.</li>
        </ul>
    </div>
</body>
</html>
